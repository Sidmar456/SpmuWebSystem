# S0.5: every push and pull request runs code style, tests and the frontend build.
name: CI

on:
  push:
    branches: [main, laravel-rewrite]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, fileinfo
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      # Tests use SQLite in memory (phpunit.xml), so no database service is needed.
      - run: php artisan test
      - run: npm ci && npm run build
